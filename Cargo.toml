[package]
name = "radioactive"
version = "0.0.1"
edition = "2021"

[features]
default = ["radtoolbox"]
# Radiological Toolbox: Access databases through mdbsql (C library, not for WebAssembly)
radtoolbox = ["dep:mdbsql"]

[dependencies]
anyhow = "1"
chumsky = "0.12.0"
fixed_width = "0.6.0"
fixed_width_derive = "0.6.0"
flagset = "0.4.7"
float-pretty-print = "0.1.1"
mdbsql = { version = "0.1.7", optional = true }
num-derive = "0.4"
num-traits = "0.2"
once_cell = "1.21.3"
petgraph = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_plain = "1"
serde_with = "3"
thiserror = "2"
